brand:
  name: SKT
  market: Singapore
  currency:
    platform_sp_local: SGD
    platform_tt_normalized: RMB
    default_sgd_to_rmb: 5.35

source_tabs:
  sp_platform_gmv:
    primary_source: DMS
    sheet: SP店铺实收GMV
    date_field: DMS daily date
    order_count_field: orderCountSum
    gmv_rmb_field: salesPriceSumRmb
    fallback_date_field: 日期date
    fallback_order_count_field: Order Count
    fallback_status_field: Order Status
    fallback_store_field: 店铺
    fallback_gmv_local_field: GMV(After Seller Discounts)
    fallback_source_column: I
    normalized_field: sp_gmv_rmb
    rule: Prefer DMS salesPriceSumRmb, which is already RMB. Use the Google Sheet column I fallback only when the DMS commerce cache is unavailable, converting with the exchange rate in 品类表. Do not use GMV(Customer Payment).

  tt_platform_gmv:
    primary_source: DMS
    sheet: TT-销售GMV
    date_field: DMS daily date
    order_count_field: orderCountSum
    gmv_local_field: salesPriceSum
    gmv_rmb_field: salesPriceSumRmb
    fallback_date_field: Order Date
    fallback_order_count_field: Order Count
    fallback_gmv_rmb_field: GMV(After seller discounts) RMB
    platform_discount_rmb_field: Platform discount RMB
    normalized_field: tt_gmv_rmb
    rule: Prefer DMS salesPriceSumRmb, which is already RMB. Use the Google Sheet RMB field only when the DMS commerce cache is unavailable.

  offsite_media:
    sheet: 站外数据源
    date_field: Date_start
    spend_field: Spend
    exchange_rate_field: 汇率
    normalized_spend_field: offsite_spend_rmb
    impression_field: Impressions
    click_field: link-Click
    conversion_field: Conversions
    purchase_value_field: Purchase Value
    normalized_purchase_value_field: offsite_purchase_value_rmb
    add_to_cart_field: Add_to_cart
    product_field: 产品
    ad_format_field: 广告类型
    funnel_type_field: 类型
    audience_type_field: 拉新/再营销
    audience_type_source_column: Q
    product_display_aliases:
      - contains: 面霜合集
        display_as: 面霜合集
      - contains: 防晒合集
        display_as: 防晒
      - contains: 洁面合集
        display_as: 洁面
    rule: Spend and Purchase Value are source-currency values. Use column C / Spend for offsite spend and multiply Spend and Purchase Value by row-level 汇率 before RMB ROAS or media-spend analysis. Match 产品 to 品类表 column T; when 产品 is blank, infer the longest T-column product match from Ad_name, adset_name, and campaign_name. Preserve still-unmatched spend as an explicit warning row. If the Google CSV export is incomplete, use the most complete dated positive-Spend local fallback and fill missing 汇率 from the latest exported offsite 汇率.

  onsite_ads:
    sheet: 站内广告
    date_field: 日期date
    spend_rmb_field: 广告花费-RMB
    gmv_rmb_field: 广告GMV-RMB
    product_field: 链接
    product_id_field: Product ID
    ad_name_field: Ad Name
    ad_type_field: Ads Type
    impression_field: Impression
    click_field: Clicks
    conversion_field: Conversions
    item_sold_field: Items Sold
    normalized_product_spend_field: onsite_spend_rmb
    rule: Use the onsite ad RMB spend directly. Match the source link to the category table T-column advertised-product catalog and expose matched spend at product/day level; unmatched store-level ads remain in category and total aggregates only.

  onsite_products:
    sheet: 站内产品数据-skt
    date_field: 日期date
    category_field: 品类
    item_id_field: Item ID
    sku_field: SKU
    product_short_field: 链接
    product_title_field: Product
    gmv_sgd_field: Sales (Placed Order) (SGD)
    exchange_rate_field: 汇率
    normalized_paid_sales_field: product_paid_sales_rmb
    source_sales_deduplication_factor: 2.0
    source_sales_note: Divide source sales by 2 because the product data includes a duplicated summary row.
    paid_units_field: Units (Paid Order)
    visitor_field: Product Visitors (Visit)
    page_view_field: Product Page Views
    add_to_cart_visitor_field: Product Visitors (Add to Cart)
    product_click_field: Product Clicks
    product_impression_field: Product Impression
    rule: Read the named Sales (Placed Order) (SGD) field by header name, never by physical column position, then multiply by the row-level 汇率 field to calculate RMB GMV; keep traffic, add-to-cart and units as native counts. Read Product Clicks and Product Impression by header name, so CTR = Product Clicks / Product Impression. Ignore newly inserted 二级品类 and 三级品类 fields until the category logic is explicitly changed.

  category_reference:
    sheet: 品类表
    exchange_rate_field: 汇率
    shop_name_field: Shop Name
    store_field: 店铺
    item_id_field: Item ID
    item_name_field: 单品
    item_category_field: 品类
    sku_field: SKU
    sku_product_name_field: 产品名
    sku_category_field: 品类
    sku_onsite_product_override_field: R
    offsite_product_field: 站外投放产品
    offsite_product_source_column: T
    offsite_onsite_product_override_field: U
    rule: Use 品类表 as the source of truth for SKU/Item/category mapping, SP SGD-to-RMB exchange rate, and the offsite advertised-product catalog in column T. Column R may explicitly map the row SKU to an onsite product name or Item ID; column U may explicitly map the row T offsite product to an onsite product name or Item ID. Match each column-T product to at most one onsite product; onsite products with data that remain unmatched are marked 未投放产品.
    mapping_priority:
      - Exact Item ID match from 新映射.
      - Exact Item ID match from 品类表.
      - Exact SKU match.
      - Exact item/product name match.
      - Contains/name keyword fallback from 品类表 labels.
      - Unmapped onsite ads fall back to 泛店铺/无产品; other rows fall back to 长尾品.

  new_mapping:
    sheet: 新映射
    gid: 1410457373
    group_field: 分组
    group_category_field: 品类 (first occurrence)
    item_id_field: Item ID
    product_field: 产品
    item_category_field: 品类 (second occurrence)
    rule: Use the named fields rather than fixed column positions. Fill down blank 分组 and group-level 品类 cells. New mapping takes priority for Item ID, product, category, and group relationships; use 品类表 only for Item IDs absent from 新映射.

  onsite_voucher_cost:
    source_table: advance-rush-406115.dim_shopee_ads_performance.sg_skt_onsite_voucher_cost_by_item
    brand_code: SKT
    date_field: period_start
    item_id_field: item_id
    seller_voucher_cost_field: seller_voucher_cost_sgd
    shopee_voucher_cost_field: shopee_voucher_cost_sgd
    metric_field: net_voucher_cost_sgd
    cache: cache/skt_voucher_item_daily.json
    currency: SGD
    display_currency: RMB
    exchange_rate: 5.23
    rule: Keep the latest row per business_key, aggregate net_voucher_cost_sgd by period_start and Item ID, then convert SGD to RMB with 5.23. Net voucher cost is seller voucher cost minus Shopee voucher cost. Aggregate to product, category, group, and daily levels; voucher ratio is voucher spend RMB divided by onsite product GMV RMB.

  platform_unit_supplements:
    primary_source: DMS
    sp_sheet: SP-销量
    tt_sheet: TT-销量
    date_field: recordDate
    sku_field: sku
    product_field: skuName
    units_field: dailyDatas.count
    fallback_date_field: 日期
    fallback_sku_field: SKU编码
    fallback_product_field: 产品
    fallback_category_field: 品类
    fallback_units_field: 销量
    fallback_prior_units_field: 上月同期销售
    rule: Prefer DMS daily SKU units and convert them to long rows. Resolve category by 新映射 then 品类表, and calculate prior-month same-day units from DMS dates. Fall back to the Google Sheet unit tabs only when the DMS commerce cache is unavailable.

derived_metrics:
  - platform_gmv_rmb = sp_gmv_rmb + tt_gmv_rmb
  - onsite_roas = onsite_ad_gmv_rmb / onsite_ad_spend_rmb
  - offsite_roas = offsite_purchase_value_rmb / offsite_spend_rmb
  - media_spend_rmb = onsite_ad_spend_rmb + offsite_spend_rmb
  - media_sales_rmb = onsite_ad_gmv_rmb + offsite_purchase_value_rmb
  - media_roas = media_sales_rmb / media_spend_rmb
  - onsite_spend_ratio = onsite_ad_spend_rmb / platform_gmv_rmb
  - offsite_spend_ratio = offsite_spend_rmb / platform_gmv_rmb
  - media_spend_ratio = media_spend_rmb / platform_gmv_rmb
  - sp_share = sp_gmv_rmb / platform_gmv_rmb
  - tt_share = tt_gmv_rmb / platform_gmv_rmb
  - category_sales_share = product_paid_sales_rmb_by_category / total_product_paid_sales_rmb
  - category_unit_growth = (sp_units + tt_units - prior_sp_units - prior_tt_units) / (prior_sp_units + prior_tt_units)
  - add_to_cart_rate = product_add_to_cart_visitors / product_visitors
  - unit_conversion_rate = product_paid_units / product_visitors
  - sales_per_visitor = product_paid_sales_rmb / product_visitors
  - voucher_spend_rmb = voucher_spend_sgd * 5.23
  - voucher_ratio = voucher_spend_rmb / product_paid_sales_rmb
