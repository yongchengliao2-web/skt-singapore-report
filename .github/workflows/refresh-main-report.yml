name: Refresh SKT main report
run-name: "SKT refresh ${{ github.event_name == 'schedule' && 'weekday-10:45' || inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Refresh request ID
        required: false
        default: manual
        type: string
  schedule:
    - cron: "45 2 * * 1-5"

permissions:
  contents: read

concurrency:
  group: skt-cloudflare-production
  cancel-in-progress: false

jobs:
  refresh-main-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SKT_REPORT_SESSION_TOKEN: ${{ secrets.REPORT_SESSION_TOKEN }}
      SKT_DMS_TOKEN: ${{ secrets.SKT_DMS_TOKEN }}
      BQ_CREDENTIALS_JSON: ${{ secrets.BQ_CREDENTIALS_JSON }}
      PROJECT_NAME: skt-singapore-report
      LIVE_URL: https://skt-singapore-report.pages.dev/

    steps:
      - name: Check out report source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Preserve current material page and snapshots
        run: >-
          python scripts/download_protected_assets.py
          --base-url "$LIVE_URL"
          --asset "/skt-material-analysis=.preserved/skt-material-analysis.html"
          --snapshot-html ".preserved/skt-material-analysis.html"
          --snapshot-output-root ".preserved"
          --workers 12
          --minimum-success-rate 0.8

      - name: Preserve prior DMS commerce cache
        continue-on-error: true
        run: >-
          python scripts/download_protected_assets.py
          --base-url "$LIVE_URL"
          --asset "/data/dms/skt_dms_commerce_latest.json=.preserved/data/dms/skt_dms_commerce_latest.json"

      - name: Refresh SKT DMS commerce cache
        continue-on-error: true
        run: >-
          python pipelines/fetch_skt_dms_commerce.py
          --start 2026-01-01
          --end "$(TZ=Asia/Shanghai date -d 'yesterday' +%F)"

      - name: Restore prior DMS commerce cache when needed
        if: always()
        shell: bash
        run: |
          if [ ! -s data/dms/skt_dms_commerce_latest.json ] && [ -s .preserved/data/dms/skt_dms_commerce_latest.json ]; then
            mkdir -p data/dms
            cp .preserved/data/dms/skt_dms_commerce_latest.json data/dms/skt_dms_commerce_latest.json
          fi

      - name: Refresh SKT voucher cache
        run: python tools/fetch_skt_voucher_cost.py --require-live

      - name: Refresh SKT BigQuery platform cache
        run: python tools/fetch_skt_bq_platform_daily.py --require-live

      - name: Build main report from Google Sheet
        run: python pipelines/build_skt_alignment.py

      - name: Validate main report freshness
        run: >-
          python scripts/check_main_report.py site/index.html
          --business-day-lag 2
          --max-stale-sources 5

      - name: Restore material page and validate bundle
        shell: bash
        run: |
          cp .preserved/skt-material-analysis.html site/skt-material-analysis.html
          mkdir -p site/assets
          cp -a .preserved/assets/. site/assets/
          if [ -s data/dms/skt_dms_commerce_latest.json ]; then
            mkdir -p site/data/dms
            cp data/dms/skt_dms_commerce_latest.json site/data/dms/skt_dms_commerce_latest.json
          fi
          test -s site/index.html
          test -s site/skt-onsite-offsite-alignment.html
          test -s site/skt-material-analysis.html
          test "$(find site/assets/material_snapshots -type f -name '*.jpg' | wc -l)" -gt 0
          grep -q 'id="refreshReport"' site/index.html
          grep -q '"report_contract_version":"skt-main-report-bq-v1"' site/index.html
          grep -q '"commerce_source":"BigQuery sg_dms_gmv_sales_daily"' site/index.html
          grep -q '"platform_daily_audit"' site/index.html
          grep -q "label: '站内销量（SP）'" site/index.html
          grep -q "value: fmt0.format(t.sp_units)" site/index.html
          ! grep -q '经营' site/index.html
          ! grep -q '经营' site/skt-material-analysis.html
          ! grep -q 'L 列 Sales (Placed Order) (SGD)' site/index.html
          grep -q 'id="offsiteProductToggle"' site/index.html
          grep -q 'data-offsite-product-row-key' site/index.html
          grep -q 'id="categorySectionToggle"' site/index.html
          grep -q 'class="category-detail-table"' site/index.html
          grep -q 'data-category-row-key' site/index.html
          grep -q 'id="groupTable"' site/index.html
          grep -q 'data-group-row-key' site/index.html
          grep -q '优惠券花费' site/index.html
          grep -q '优惠券占比' site/index.html
          grep -q 'voucher_audit' site/index.html
          grep -q 'PAGE_DATA' site/skt-material-analysis.html
          grep -q '"snapshot_url":"/assets/material_snapshots/' site/skt-material-analysis.html

      - name: Prepare Cloudflare Pages bundle
        shell: bash
        run: |
          rm -rf cloudflare_pages
          mkdir -p cloudflare_pages
          cp -a site/. cloudflare_pages/
          cp scripts/cloudflare_password_worker.js cloudflare_pages/_worker.js
          printf '/*\n  Cache-Control: no-store\n' > cloudflare_pages/_headers

      - name: Deploy main report to Cloudflare Pages
        run: >-
          npx --yes wrangler@4.113.0 pages deploy cloudflare_pages
          --project-name "$PROJECT_NAME"
          --branch main
          --commit-dirty=true

      - name: Verify deployed main report content
        shell: bash
        run: |
          verified=0
          for attempt in $(seq 1 12); do
            rm -rf .verify
            if python scripts/download_protected_assets.py \
              --base-url "$LIVE_URL" \
              --asset "/=.verify/index.html" \
              && cmp -s site/index.html .verify/index.html; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" -eq 1
          python scripts/check_main_report.py .verify/index.html \
            --business-day-lag 2 \
            --max-stale-sources 5

      - name: Verify password gate
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/skt-login.html -w '%{http_code}' "$LIVE_URL")
            if [ "$code" = "401" ] && grep -q 'action="/__auth"' /tmp/skt-login.html; then
              exit 0
            fi
            sleep 5
          done
          echo "Password gate verification failed" >&2
          exit 1
